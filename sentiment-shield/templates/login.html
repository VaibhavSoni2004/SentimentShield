<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SentimentShield - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-slate-950 via-zinc-950 to-cyan-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-900/80 backdrop-blur p-8 rounded-3xl border border-cyan-500/20 shadow-2xl space-y-6">
        <div class="text-center space-y-2">
            <h1 class="text-3xl font-black bg-gradient-to-r from-cyan-400 to-fuchsia-400 bg-clip-text text-transparent">
                ⚡ SentimentShield
            </h1>
            <p id="form-subtitle" class="text-xs text-cyan-400/70 font-semibold">Sign in to access your command center</p>
        </div>

        <form id="authForm" class="space-y-4">
            <div>
                <label class="block text-xs font-black text-slate-400 uppercase tracking-wider mb-2">Username</label>
                <input type="text" id="username" required class="w-full bg-slate-950 border border-cyan-500/20 rounded-2xl p-3.5 text-slate-100 focus:outline-none focus:border-cyan-400 text-sm">
            </div>
            <div>
                <label class="block text-xs font-black text-slate-400 uppercase tracking-wider mb-2">Password</label>
                <input type="password" id="password" required class="w-full bg-slate-950 border border-cyan-500/20 rounded-2xl p-3.5 text-slate-100 focus:outline-none focus:border-cyan-400 text-sm">
            </div>
            <button type="submit" id="submit-btn" class="w-full bg-gradient-to-r from-cyan-500 to-teal-500 hover:from-cyan-400 hover:to-teal-400 text-slate-950 font-black py-3.5 rounded-2xl transition shadow-lg shadow-cyan-500/25 text-sm">
                Login
            </button>
        </form>

        <div class="text-center">
            <button type="button" onclick="toggleMode()" id="switch-mode-btn" class="text-xs text-cyan-400 hover:underline font-bold">
                Don't have an account? Register
            </button>
        </div>
    </div>

    <script>
        const API_BASE = "";
        let isLoginMode = true;

        function toggleMode() {
            isLoginMode = !isLoginMode;
            document.getElementById("form-subtitle").innerText = isLoginMode ? "Sign in to access your command center" : "Create a new account to get started";
            document.getElementById("submit-btn").innerText = isLoginMode ? "Login" : "Register";
            document.getElementById("switch-mode-btn").innerText = isLoginMode ? "Don't have an account? Register" : "Already have an account? Login";
        }

        document.getElementById("authForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const endpoint = isLoginMode ? "/login" : "/register";

            try {
                const res = await fetch(`${API_BASE}${endpoint}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (res.ok) {
                    alert(data.message);
                    if (isLoginMode) {
                        localStorage.setItem("user", username);
                        window.location.href = "/";
                    } else {
                        toggleMode();
                    }
                } else {
                    alert(data.detail || "Authentication failed");
                }
            } catch (err) {
                console.error(err);
                alert("Server connection error");
            }
        });
    </script>
</body>
</html>
