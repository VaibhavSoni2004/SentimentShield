<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComplaintFlow - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex items-center justify-center p-6">

    <div class="w-full max-w-md">

        <!-- Brand -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-slate-900 text-white mb-4 shadow-sm">
                <i class="fa-solid fa-shield-halved text-lg"></i>
            </div>

            <h1 class="text-2xl font-bold tracking-tight text-slate-900">
                ComplaintFlow
            </h1>

            <p class="mt-2 text-sm text-slate-500">
                Complaint Analysis & Resolution System
            </p>
        </div>

        <!-- Login Card -->
        <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-8">

            <div class="mb-7">
                <h2 class="text-xl font-semibold text-slate-900">
                    Welcome back
                </h2>

                <p id="form-subtitle" class="text-sm text-slate-500 mt-1">
                    Sign in to access your account
                </p>
            </div>

            <!-- Login Type -->
            <div class="mb-6">
                <label class="block text-sm font-medium text-slate-700 mb-3">
                    Login as
                </label>

                <div class="grid grid-cols-2 gap-3">

                    <button
                        type="button"
                        id="user-login-btn"
                        onclick="selectLoginType('user')"
                        class="login-type-btn border-2 border-slate-900 bg-slate-900 text-white rounded-xl p-3 text-sm font-semibold transition"
                    >
                        <i class="fa-solid fa-user mr-2"></i>
                        User
                    </button>

                    <button
                        type="button"
                        id="admin-login-btn"
                        onclick="selectLoginType('admin')"
                        class="login-type-btn border-2 border-slate-200 bg-white text-slate-600 rounded-xl p-3 text-sm font-semibold hover:border-slate-400 transition"
                    >
                        <i class="fa-solid fa-shield-halved mr-2"></i>
                        Admin
                    </button>

                </div>
            </div>

            <!-- Authentication Form -->
            <form id="authForm" class="space-y-5">

                <div>
                    <label
                        for="username"
                        class="block text-sm font-medium text-slate-700 mb-2"
                    >
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        required
                        autocomplete="username"
                        placeholder="Enter your username"
                        class="w-full px-4 py-3 bg-white border border-slate-300 rounded-xl text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900/10 focus:border-slate-900 transition"
                    >
                </div>

                <div>
                    <label
                        for="password"
                        class="block text-sm font-medium text-slate-700 mb-2"
                    >
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        required
                        autocomplete="current-password"
                        placeholder="Enter your password"
                        class="w-full px-4 py-3 bg-white border border-slate-300 rounded-xl text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900/10 focus:border-slate-900 transition"
                    >
                </div>

                <button
                    type="submit"
                    id="submit-btn"
                    class="w-full bg-slate-900 hover:bg-slate-800 text-white font-semibold py-3 rounded-xl transition shadow-sm text-sm"
                >
                    Sign In
                </button>

            </form>
            
            <!-- Register -->
            <div class="text-center mt-6 pt-6 border-t border-slate-100">
                <button
                    type="button"
                    onclick="toggleMode()"
                    id="switch-mode-btn"
                    class="text-sm text-slate-600 hover:text-slate-900 font-medium transition"
                >
                    Don't have an account?
                    <span class="font-semibold text-slate-900">
                        Register
                    </span>
                </button>
            </div>

        </div>

        <!-- Footer -->
        <p class="text-center text-xs text-slate-400 mt-6">
            Secure access to ComplaintFlow        </p>

    </div>

    <script>
        const API_BASE = "";
        let isLoginMode = true;

        function toggleMode() {
            isLoginMode = !isLoginMode;
            document.getElementById("form-subtitle").innerText = isLoginMode ? "Sign in to access your account" : "Create a new account to get started";
            document.getElementById("submit-btn").innerText = isLoginMode ? "Sign In" : "Create Account";
            document.getElementById("switch-mode-btn").innerHTML = isLoginMode
                ? `Don't have an account? <span class="font-semibold text-slate-900">Register</span>`
                : `Already have an account? <span class="font-semibold text-slate-900">Sign In</span>`;
        }

        let selectedLoginType = "user";

        function selectLoginType(type) {
            selectedLoginType = type;

            const userBtn = document.getElementById("user-login-btn");
            const adminBtn = document.getElementById("admin-login-btn");

            if (type === "user") {
                userBtn.className = "login-type-btn border-2 border-slate-900 bg-slate-900 text-white rounded-xl p-3 text-sm font-semibold transition";
                adminBtn.className = "login-type-btn border-2 border-slate-200 bg-white text-slate-600 rounded-xl p-3 text-sm font-semibold hover:border-slate-400 transition";
            } else {
                adminBtn.className = "login-type-btn border-2 border-slate-900 bg-slate-900 text-white rounded-xl p-3 text-sm font-semibold transition";
                userBtn.className = "login-type-btn border-2 border-slate-200 bg-white text-slate-600 rounded-xl p-3 text-sm font-semibold hover:border-slate-400 transition";
            }
        }

        document.getElementById("authForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const endpoint = isLoginMode ? "/login" : "/register";

            try {
                const res = await fetch(`${API_BASE}${endpoint}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                      username,
                      password,
                      login_type: selectedLoginType
                      })
                });

                const data = await res.json();

                if (res.ok) {

                    alert(data.message);

                    if (isLoginMode) {

                        localStorage.setItem("user", username);
                        localStorage.setItem("token", data.access_token);
                        localStorage.setItem("role", data.role);

                        window.location.href = "/";

                    } else {

                        toggleMode();

                    }

                } else {

                    alert(data.detail || "Authentication failed");

                }

            } catch (err) {

                console.error(err);
                alert("Server connection error");

            }
        });
    </script>

</body>
</html>
